schema_version = 2

[plugin]
id = "yolo26"
name = "YOLO26 Object Detection"
version = "0.1.0"
protocol_version = 2
executable = "bin/worker"

[[capabilities]]
id = "vision.detect"
name = "Object detection"
description = "Runs object detection on the RK3576 NPU using the selected Ultralytics YOLO26 FP16 model."
input_kind = "image"
accepted_content_types = ["image/jpeg", "image/png"]
max_input_bytes = 10485760
output_kind = "detections"
output_content_type = "application/json"

[capabilities.presentation]
renderer = "image_detection_overlay"
input_hint = "Upload a JPEG or PNG image. Detection boxes are overlaid on the original image after inference."

[[capabilities.parameters]]
key = "confidence"
label = "Confidence threshold"
description = "Filters low-confidence detections. Lowering the threshold can improve recall but increases false positives."
kind = "number"
required = false
default = "0.25"
min = 0.01
max = 1.0

[[capabilities.parameters]]
key = "iou"
label = "NMS IoU threshold"
description = "Non-maximum suppression threshold for candidate boxes of the same class."
kind = "number"
required = false
default = "0.70"
min = 0.0
max = 1.0

[[capabilities.parameters]]
key = "max_detections"
label = "Maximum detections"
description = "Maximum number of detections returned per image."
kind = "number"
required = false
default = "300"
min = 1
max = 300

[[configuration.fields]]
key = "model"
label = "Detection model"
description = "Discovers RKNN models in the plugin model directory. Changing the model while running automatically reloads the worker."
kind = "select"
required = true
options_from = "rknn_models"

[resources.npu]
allowed_masks = ["core0", "core1", "core0_1"]
default_mask = "core0_1"
max_concurrency = 1
queue_size = 16
request_timeout_ms = 30000

