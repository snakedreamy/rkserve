schema_version = 2

[plugin]
id = "matcha-tts"
name = "Matcha Chinese/English TTS"
version = "0.1.0"
protocol_version = 2
executable = "bin/worker"

[[capabilities]]
id = "audio.speech"
name = "Fast Chinese/English speech synthesis"
description = "The Matcha acoustic network and Vocos vocoder run on the RK3576 NPU, with FP32 duration calibration to avoid pauses and repetition in short English phrases."
input_kind = "text"
accepted_content_types = ["text/plain"]
max_input_bytes = 32768
output_kind = "audio"
output_content_type = "audio/wav"

[capabilities.presentation]
renderer = "audio_player"
input_hint = "One model supports Chinese, English and mixed-language text. Long text is split into segments and synthesized in full."
input_placeholder = "Enter Chinese, English or mixed-language text to synthesize…"
text_examples = [
  "你好，欢迎使用运行在瑞芯微 NPU 上的快速语音合成服务。",
  "Hello! Is there something you want to practise in English today?",
  "今天的 build 已经完成，欢迎测试 Matcha TTS。"
]

[[capabilities.parameters]]
key = "speed"
label = "Speech speed"
description = "1.0 is the original model speed; higher values produce faster speech."
kind = "number"
required = false
default = "1.0"
min = 0.7
max = 1.4

[[capabilities.parameters]]
key = "noise_scale"
label = "Voice variation"
description = "Controls generation variation. The default is 0.667 and usually needs no adjustment."
kind = "number"
required = false
default = "0.667"
min = 0.3
max = 1.0

[[configuration.fields]]
key = "speed"
label = "Default speech speed"
description = "Used when a request does not specify a speech speed."
kind = "number"
required = false
default = "1.0"
min = 0.7
max = 1.4

[[configuration.fields]]
key = "noise_scale"
label = "Default voice variation"
description = "Used when a request does not specify voice variation."
kind = "number"
required = false
default = "0.667"
min = 0.3
max = 1.0

[resources.npu]
allowed_masks = ["core0", "core1", "core0_1"]
default_mask = "core0_1"
max_concurrency = 1
queue_size = 16
request_timeout_ms = 120000

